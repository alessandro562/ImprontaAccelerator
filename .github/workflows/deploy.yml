name: Deploy su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# I deploy di Pages non vanno interrotti a metà: si accodano.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Fallisce finché Pages non è stato attivato a mano nelle impostazioni del
      # repo. Non è un motivo per bloccare la build: si prosegue con i default e
      # a fallire resta il solo deploy finale, il cui errore dice esattamente
      # cosa fare.
      - name: Configura Pages
        id: pages
        uses: actions/configure-pages@v6
        continue-on-error: true

      - name: Risolvi URL e base path
        run: |
          SITE_URL="${{ steps.pages.outputs.origin }}"
          BASE_PATH="${{ steps.pages.outputs.base_path }}"
          # Finche' GitHub non ha emesso il certificato per il dominio custom,
          # l'API di Pages riporta l'origine in http. I canonical, la sitemap e
          # le og:image sono URL assoluti e resterebbero in http anche dopo:
          # si normalizza qui invece di rifare la build il giorno dopo.
          SITE_URL="${SITE_URL/#http:\/\//https://}"
          if [ -z "$SITE_URL" ]; then
            SITE_URL="https://${{ github.repository_owner }}.github.io"
            BASE_PATH="/${{ github.event.repository.name }}"
            echo "::warning::Pages non ancora attivo: uso i valori di default. Settings -> Pages -> Source: GitHub Actions."
          fi
          echo "SITE_URL=$SITE_URL"   >> "$GITHUB_ENV"
          echo "BASE_PATH=$BASE_PATH" >> "$GITHUB_ENV"
          echo "Build per ${SITE_URL}${BASE_PATH}/"

      - run: npm ci

      # Fallisce se i dizionari IT ed EN divergono
      - run: npx astro check

      - run: npm run build

      - name: Verifica che i link abbiano il base path giusto
        run: |
          if [ -n "$BASE_PATH" ] && [ "$BASE_PATH" != "/" ]; then
            # Project site: ogni link assoluto deve stare dentro il base path.
            BAD=$(grep -rhoE '(href|src)="/[^"]*' dist --include='*.html' | grep -v "\"$BASE_PATH/" || true)
            if [ -n "$BAD" ]; then
              echo "::error::Link o asset che ignorano il base path:"; echo "$BAD" | sort -u; exit 1
            fi
            echo "Nessun link assoluto fuori dal base path."
          else
            # Dominio custom: il caso opposto, e quello che ci e' sfuggito il
            # 18 settembre. Il vecchio percorso non deve comparire piu' da
            # nessuna parte, o il sito chiede CSS e font dove non ci sono.
            BAD=$(grep -rhoE '(href|src)="/ImprontaAccelerator[^"]*' dist --include='*.html' || true)
            if [ -n "$BAD" ]; then
              echo "::error::Il sito e' alla radice del dominio ma i link portano ancora il vecchio percorso:"
              echo "$BAD" | sort -u; exit 1
            fi
            echo "Nessun residuo del vecchio percorso: il sito e' alla radice."
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
